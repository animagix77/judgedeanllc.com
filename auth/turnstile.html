<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' https://challenges.cloudflare.com 'unsafe-inline'; style-src 'unsafe-inline'; frame-src https://challenges.cloudflare.com; connect-src https://challenges.cloudflare.com; img-src data: https://challenges.cloudflare.com; base-uri 'none'; form-action 'none'; object-src 'none'">
  <title>CampShhh contribution verification · Judge Dean LLC</title>
  <style>
    html,body { margin:0; min-height:100%; background:#fcfcf6; color:#20372a; font:16px/1.5 -apple-system,BlinkMacSystemFont,sans-serif; }
    main { padding:24px 12px; display:flex; flex-direction:column; align-items:center; gap:20px; }
    #status { max-width:340px; text-align:center; margin:0; }
  </style>
</head>
<body>
  <main><p id="status" role="status">Complete the verification below.</p><div id="challenge"></div></main>
  <script>
    // Judge Dean LLC — public configuration only. Supabase validates the token.
    (() => {
      'use strict';
      const parameters = new URLSearchParams(location.search);
      const sitekey = parameters.get('sitekey');
      const nonce = parameters.get('nonce');
      let parentOrigin = null;
      try {
        const parent = new URL(parameters.get('parentOrigin'));
        if (!parent.username && !parent.password && parent.href === parent.origin + '/'
          && (parent.protocol === 'https:' || (parent.protocol === 'http:' && parent.hostname === 'localhost'))) parentOrigin = parent.origin;
      } catch (_) {}
      let sent = false;
      const send = (type, token) => {
        if (sent) return;
        sent = true;
        const message = JSON.stringify({channel:'campshhh-turnstile-v1',nonce,type,...(token ? {token} : {})});
        if (window.ReactNativeWebView) window.ReactNativeWebView.postMessage(message);
        else if (parentOrigin && window.parent !== window) window.parent.postMessage(message, parentOrigin);
        document.getElementById('status').textContent = type === 'success' ? 'Verified. Returning to CampShhh…' : 'Verification could not finish. Return to CampShhh and try again.';
      };
      window.onTurnstileLoad = () => {
        if (!sitekey || !/^[A-Za-z0-9_-]{1,32}$/.test(sitekey) || !nonce || !/^[A-Za-z0-9_-]{16,128}$/.test(nonce)) {
          document.getElementById('status').textContent = 'Verification is unavailable. Return to CampShhh.';
          return;
        }
        window.turnstile.render('#challenge', {
          sitekey, action:'anonymous_contribution', theme:'light', size:'flexible',
          callback: token => send('success',token),
          'error-callback': () => send('error'),
          'expired-callback': () => send('expired'),
          'timeout-callback': () => send('expired'),
        });
      };
    })();
  </script>
  <script src="https://challenges.cloudflare.com/turnstile/v0/api.js?onload=onTurnstileLoad&amp;render=explicit" async defer></script>
</body>
</html>
