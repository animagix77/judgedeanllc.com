name: Supabase keepalive

# Pings the DCProximity catalog every 3 days so the Supabase free-tier project
# never goes idle long enough to be auto-paused. Also writes a heartbeat file so
# this scheduled workflow itself isn't disabled after 60 days of repo inactivity.
# The key below is the PUBLIC publishable (anon) key — safe to commit.

on:
  schedule:
    - cron: '17 9 */3 * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Ping Supabase catalog
        run: |
          curl -fsS "https://cyivyohodcslocukzuap.supabase.co/rest/v1/data_centers?select=id&limit=1" \
            -H "apikey: sb_publishable_EH7-LYEuoHlMKxNsPSvq_A_tVvuX8kH" \
            -H "Authorization: Bearer sb_publishable_EH7-LYEuoHlMKxNsPSvq_A_tVvuX8kH"
          echo "Supabase keepalive ping OK"
      - name: Heartbeat
        run: |
          mkdir -p .github
          date -u +"%Y-%m-%dT%H:%M:%SZ" > .github/keepalive-heartbeat.txt
          git config user.name "keepalive-bot"
          git config user.email "actions@users.noreply.github.com"
          git add .github/keepalive-heartbeat.txt
          git commit -m "chore: supabase keepalive heartbeat [skip ci]" || echo "no change to commit"
          git push || echo "nothing to push"
